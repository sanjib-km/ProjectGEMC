<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Consignee Pending - Project GEMC</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
    <nav>
        <a href="/view">View Contracts</a>
        <a href="/home" active>Pending</a>
        <a href="/history">History</a>
        <a href="/account">Account</a>
    </nav>

    <div class="container">
        <div class="card-header" style="border-radius: 8px 8px 0 0; margin-bottom: 20px;">
            <h2 style="margin: 0;">Pending Contracts</h2>
        </div>

        <div th:if="${#lists.isEmpty(contracts)}" style="text-align: center; padding: 40px;">
            <h4 style="color: #777;">No pending contracts available for processing.</h4>
        </div>
        
        <div th:if="${not #lists.isEmpty(contracts)}">
            <table>
                <thead>
                    <tr>
                        <th>GEMC No</th>
                        <th>Contract Date</th>
                        <th>Buyer</th>
                        <th>Seller</th>
                        <th style="text-align: center;">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${contracts}">
                        <td th:text="${c.gemNo}" style="font-weight: bold;"></td>
                        <td th:text="${#temporals.format(c.contractDate, 'dd-MM-yyyy')}"></td>
                        <td th:text="${c.buyerName.name}"></td>
                        <td th:text="${c.sellerName}"></td>
                        <td style="text-align: center;">
                            <a th:href="@{/consignee/add/{id}(id=${c.contractId})}">
                                <button type="button">Add Details</button>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div th:if="${totalPages > 0}" class="pagination-wrapper" style="margin-top: 30px; text-align: center;">
                <hr>
                <div style="display: flex; justify-content: center; align-items: center; gap: 15px; padding-top: 10px;">
                    <a th:if="${currentPage > 0}" th:href="@{/home(page=${currentPage - 1})}">
                        <button class="btn-secondary">Previous</button>
                    </a>
                    
                    <span style="font-weight: 500;">Page [[${currentPage + 1}]] of [[${totalPages}]]</span>
                    
                    <a th:if="${currentPage < totalPages - 1}" th:href="@{/home(page=${currentPage + 1})}">
                        <button class="btn-secondary">Next</button>
                    </a>
                </div>
            </div>
        </div>
    </div>
	<footer>
		    <div class="footer-content">
		        <p style="margin: 0;">&copy; 2026 Project GEMC. All Rights Reserved.</p>
		        <p style="margin: 0;">Developed by: 
		            <a href="https://sanjibkumarmalakar.netlify.app/" target="_blank" class="developer-link">
		                Mr. Sanjib Kumar Malakar
		            </a>
		        </p>
		    </div>
	</footer>
    <script th:inline="javascript" th:if="${message}">
        alert([[${message}]]);
    </script>
</body>
</html>
