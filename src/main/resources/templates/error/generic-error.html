<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Error - Project GEMC</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        /* Specific override for the error theme */
        .card-error {
            border: 1px solid var(--danger-color);
            max-width: 600px;
            margin: 50px auto;
        }
        .header-error {
            background-color: var(--danger-color) !important;
        }
    </style>
</head>
<body class="bg-light">
    <nav>
        <a href="/home">Home</a>
        <a href="/view">View Contracts</a>
        <a href="https://donationskm.netlify.app/">About</a>
    </nav>

    <div class="container">
        <div class="card card-error">
            <div class="card-header header-error">
                <h3 th:text="${errorTitle}" style="margin: 0; color: white;">Error</h3>
            </div>
            <div style="padding: 30px; text-align: center;">
                <p style="font-size: 1.2rem; margin-bottom: 20px;" th:text="${errorMessage}">Something went wrong while processing your request.</p>
                <hr>
                <div style="margin-top: 20px;">
                    <a href="/home">
                        <button class="btn-secondary">Return Home</button>
                    </a>
                </div>
            </div>
        </div>
    </div>
    <footer>
		    <div class="footer-content">
		        <p style="margin: 0;">&copy; 2026 Project GEMC. All Rights Reserved.</p>
		        <p style="margin: 0;">Developed by: 
		            <a href="https://sanjibkumarmalakar.netlify.app/" target="_blank" class="developer-link">
		                Mr. Sanjib Kumar Malakar
		            </a>
		        </p>
		    </div>
	</footer>
</body>
</html>
