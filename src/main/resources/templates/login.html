<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Login - Project GEMC</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        /* Specific centering for the login screen */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .login-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .login-header h2 {
            color: var(--primary-color);
            margin: 0;
        }
        .login-header p {
            color: #777;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <nav>
        <a href="/home">Home</a>
        <a href="/view">View Contracts</a>
        <a href="/map-login" active>Login</a>
        <a href="https://donationskm.netlify.app/">About</a>
    </nav>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <h2>Project GEMC</h2>
                <p>Institute Procurement System</p>
            </div>

            <form action="/login" method="post">
                <div style="margin-bottom: 15px;">
                    <label>User Name</label>
                    <input type="text" name="userName" placeholder="Enter your username" required>
                </div>
                
                <div style="margin-bottom: 20px;">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" style="width: 100%; padding: 12px;">Log In</button>
            </form>
            
            <div th:if="${param.error}" class="error-msg" style="margin-top: 15px; text-align: center;">
                Invalid username or password.
            </div>
        </div>
    </div>
	<footer>
		    <div class="footer-content">
		        <p style="margin: 0;">&copy; 2026 Project GEMC. All Rights Reserved.</p>
		        <p style="margin: 0;">Developed by: 
		            <a href="https://sanjibkumarmalakar.netlify.app/" target="_blank" class="developer-link">
		                Mr. Sanjib Kumar Malakar
		            </a>
		        </p>
		    </div>
	</footer>
    <script th:inline="javascript" th:if="${message}">
        alert([[${message}]]);
    </script>
</body>
</html>
