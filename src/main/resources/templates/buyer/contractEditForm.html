<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Edit Contract - Project GEMC</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
    <nav>
        <a href="/view">View Contracts</a>
        <a href="/home">Add Contract</a>
        <a href="/history" active>History</a>
        <a href="/account">Account</a>
    </nav>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <h3 style="margin:0;">Edit Contract Details</h3>
            </div>
            <div style="padding: 20px;">
                <form th:action="@{/contract/update}" method="POST">
                    <input type="hidden" name="contractId" th:value="${contract.contractId}" />
                    
                    <div class="row">
                        <div class="col-md-6">
                            <label>GEMC Number</label>
                            <input type="text" name="gemNo" th:value="${contract.gemNo}" placeholder="GEMC/..." required>
                            <span th:text="${errorMsg}" class="error-msg"></span>
                        </div>
                        <div class="col-md-6">
                            <label>Contract Date</label>
                            <input type="date" name="contractDate" th:value="${contract.contractDate}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <label>Buyer Name</label>
                            <input type="text" th:value="${contract.buyerName.name}" readonly style="background: #eee;">
                            <input type="hidden" th:value="${contract.buyerName.userid}" name="buyerName">
                        </div>
                        <div class="col-md-6">
                            <label>Seller Name</label>
                            <input type="text" name="sellerName" th:value="${contract.sellerName}" required>
                        </div>
                    </div>

                    <label>Account Details</label>
                    <textarea name="accountDetails" th:text="${contract.accountDetails}" rows="3" required></textarea>

                    <div class="row">
                        <div class="col-md-4">
                            <label>Amount</label>
                            <input type="number" step="0.01" name="amount" th:value="${contract.amount}" required>
                        </div>
                        <div class="col-md-4">
                            <label>Quantity</label>
                            <input type="number" name="quantity" th:value="${contract.quantity}" required>
                        </div>
                        <div class="col-md-4">
                            <label>Order Status</label>
                            <select name="orderStatus" required>
                                <option value="" th:selected="${contract.orderStatus == null}">-- Select --</option>
                                <option value="Accepted" th:selected="${contract.orderStatus == 'Accepted'}">Accepted by Seller</option>
                                <option value="Rejected" th:selected="${contract.orderStatus == 'Rejected'}">Rejected by Seller</option>
                                <option value="Cancelled" th:selected="${contract.orderStatus == 'Cancelled'}">Cancelled by Buyer</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <label>Item Details</label>
                            <input type="text" name="itemDetails" th:value="${contract.itemDetails}" required>
                        </div>
                        <div class="col-md-6">
                            <label>Intender</label>
                            <input type="text" name="intender" th:value="${contract.intender}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4">
                            <label>Source of Fund</label>
                            <select name="sourceOfFund" id="sourceOfFund" required>
                                <option value="" th:selected="${contract.sourceOfFund == null}">-- Select --</option>
                                <option value="project" th:selected="${contract.sourceOfFund == 'project'}">Project</option>
                                <option value="core" th:selected="${contract.sourceOfFund == 'core'}">Core</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label>Project Name</label>
                            <input type="text" id="projectName" name="projectName" th:value="${contract.projectName}" required>
                        </div>
                        <div class="col-md-4">
                            <label>e-File No</label>
                            <input type="text" name="eFileNo" th:value="${contract.eFileNo}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <label>Purchase Request Put up By</label>
                            <input type="text" name="pur_req_putupBy" th:value="${contract.pur_req_putupBy}" required>
                        </div>
                        <div class="col-md-6">
                            <label>Consignee Name</label>
                            <select name="consigneeName" required>
                                <option value="">-- Select Consignee --</option>
                                <option th:each="consignee : ${consignees}" 
                                        th:value="${consignee.userid}" 
                                        th:text="${consignee.name}"
                                        th:selected="${contract.consigneeName != null && contract.consigneeName.userid == consignee.userid}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <div style="text-align: right; margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px;">
                        <button type="reset" class="btn-secondary">Reset Changes</button>
                        <button type="submit" onclick="return confirm('Are you sure you want to save these changes?');">Update Contract</button>
                    </div>
                    
                   
                </form>
            </div>
        </div>
    </div>
	<footer>
		    <div class="footer-content">
		        <p style="margin: 0;">&copy; 2026 Project GEMC. All Rights Reserved.</p>
		        <p style="margin: 0;">Developed by: 
		            <a href="https://sanjibkumarmalakar.netlify.app/" target="_blank" class="developer-link">
		                Mr. Sanjib Kumar Malakar
		            </a>
		        </p>
		    </div>
	</footer>
    <script>
        const sourceSelect = document.getElementById('sourceOfFund');
        const projectInput = document.getElementById('projectName');

        function updateProjectState() {
            if (sourceSelect.value === 'core') {
                projectInput.disabled = true;
                projectInput.style.background = "#eee";
                projectInput.value = ''; 
            } else {
                projectInput.disabled = false;
                projectInput.style.background = "#fff";
            }
        }

        sourceSelect.addEventListener('change', updateProjectState);
        window.addEventListener('load', updateProjectState);
    </script>
     <script th:inline="javascript" th:if="${message}">
        alert([[${message}]]);
    </script>
</body>
</html>
