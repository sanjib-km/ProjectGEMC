# App Identity
spring.application.name=ProjectGEMC
server.port=${GEMC_PORT:8081}

# Database Configuration (Soft-coded)
# Format: ${ENVIRONMENT_VARIABLE:default_value}
spring.datasource.url=${GEMC_DB_URL:jdbc:mysql://localhost:3306/gemc}
spring.datasource.username=${GEMC_DB_USER:root}
spring.datasource.password=${GEMC_DB_PASS:root}

# Hibernate Strategy
# Use 'update' for development, 'validate' or 'none' for production
spring.jpa.hibernate.ddl-auto=${GEMC_DDL_STRATEGY:update}

# Optional: Show SQL in console for debugging (soft-coded)
spring.jpa.show-sql=${GEMC_SHOW_SQL:false}

spring.jpa.open-in-view=${GEMC_JPA_OPEN_IN_VIEW:true}
# LOGGING CONFIGURATION
# If LOG_PATH is not set, it defaults to a 'logs' folder in the current directory
logging.file.name=${GEMC_LOG_PATH:logs/project_gemc_log.log}

# LOG LEVELS
# You can change the level to DEBUG via environment variable if you need to troubleshoot
logging.level.root=${GEMC_LOG_LEVEL_ROOT:WARN}
logging.level.com.projectgemc=${GEMC_LOG_LEVEL_APP:INFO}

# Rotation Policy (Standard for 2026)
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=10