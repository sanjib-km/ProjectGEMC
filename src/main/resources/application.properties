# App Identity
spring.application.name=ProjectGEMC
server.port=${PORT:8081}

# Database Configuration (Soft-coded)
# Format: ${ENVIRONMENT_VARIABLE:default_value}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gemc}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}

# Hibernate Strategy
# Use 'update' for development, 'validate' or 'none' for production
spring.jpa.hibernate.ddl-auto=${DDL_STRATEGY:update}

# Optional: Show SQL in console for debugging (soft-coded)
spring.jpa.show-sql=${SHOW_SQL:false}